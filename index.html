<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너굴의 향신료상점</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="shop">
  <header class="sign">
    <div class="sign-board">
      <div class="sign-inner">
      <span class="sign-top" aria-hidden="true">✦ Spice &amp; Herb Bazaar ✦</span>
      <h1>너굴의 향신료상점</h1>
      <p class="sign-sub">어서 오세요. 마음에 드는 서랍을 열어 보세요.</p>
      </div>
    </div>
  </header>

  <nav class="filters" aria-label="분류">
    <button class="filter active" data-filter="all">전체</button>
    <button class="filter" data-filter="향신료">향신료</button>
    <button class="filter" data-filter="허브">허브</button>
  </nav>

  <main>
    <section class="cabinet" id="cabinet" aria-label="향신료 서랍장">
      <!-- 서랍은 app.js가 spices.json을 읽어 채웁니다 -->
    </section>
  </main>

  <footer class="footer">
    <p>© 너굴의 향신료상점 · 서랍 속 이야기는 계속 채워집니다</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
