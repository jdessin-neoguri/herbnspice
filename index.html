<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너굴의 향신료상점</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;600;700&family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="shop">
  <header class="sign">
    <div class="sign-board">
      <div class="sign-inner">
        <span class="sign-top" aria-hidden="true">✦ Spice &amp; Herb Bazaar ✦</span>
        <h1>너굴의 향신료상점</h1>
        <figure class="motto">
          <blockquote lang="el">
            «Τα μπαχαρικά, είναι ένα μεγάλο εργοστάσιο, που αν το δουλέψεις σωστά και κάνεις τους σωστούς συνδυασμούς, το αποτέλεσμα θα είναι μαγικό.»
          </blockquote>
          <p class="motto-ko">“향신료는 하나의 거대한 공장이란다. 제대로 다루고 알맞게 조합한다면, 그 결과는 마법처럼 될 거야.”</p>
          <figcaption>— <cite lang="el">«Πολίτικη Κουζίνα»</cite> (터치 오브 스파이스, 2003)</figcaption>
        </figure>
      </div>
    </div>
  </header>

  <nav class="filters" aria-label="분류">
    <button class="filter active" data-filter="all">전체</button>
    <button class="filter" data-filter="향신료">향신료</button>
    <button class="filter" data-filter="허브">허브</button>
  </nav>

  <main class="shop-main">
    <section class="cabinet" id="cabinet" aria-label="향신료 서랍장">
      <!-- 서랍은 app.js가 spices.json을 읽어 채웁니다 -->
    </section>
  </main>

  <footer class="footer">
    <p>© 너굴의 향신료상점 · 서랍 속 이야기는 계속 채워집니다</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
